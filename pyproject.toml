[project]
name = "credit-scoring-tech-challenge"
version = "0.1.0"
description = "Tech Challenge FIAP Fase 4 — observabilidade, drift, qualidade de dados e governança LGPD para credit scoring."
authors = [{ name = "FIAP Tech Challenge Group" }]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26,<2",
    "scikit-learn>=1.3",
    "pandera>=0.18",
    "evidently>=0.4",
    "mlflow>=2.10",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.urls]
Repository = "https://github.com/jusoper/tech-challenge-4"

[tool.poetry]
packages = [{ include = "credit_scoring", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.4"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
